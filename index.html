<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테니스 복식조 편성기</title>
<style>
  :root {
    --court-green: #1f7a4d;
    --court-green-dark: #145c39;
    --court-green-soft: #e4f1e9;
    --line-white: #f5f5f0;
    --clay: #c1542c;
    --clay-dark: #9c4020;
    --ball: #c7d94a;
    --ink: #17241c;
    --muted: #5f6f66;
    --bg: #f2f6f1;
    --card-bg: #ffffff;
    --border: #dde4da;
    --shadow: 0 1px 2px rgba(23, 36, 28, 0.04), 0 8px 24px rgba(23, 36, 28, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --court-green-soft: #163425;
      --bg: #10160f;
      --card-bg: #182018;
      --ink: #e9f0e6;
      --muted: #97a89d;
      --border: #293429;
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.24);
    }
  }
  :root[data-theme="dark"] {
    --court-green-soft: #163425;
    --bg: #10160f;
    --card-bg: #182018;
    --ink: #e9f0e6;
    --muted: #97a89d;
    --border: #293429;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.24);
  }
  :root[data-theme="light"] {
    --court-green-soft: #e4f1e9;
    --bg: #f2f6f1;
    --card-bg: #ffffff;
    --ink: #17241c;
    --muted: #5f6f66;
    --border: #dde4da;
    --shadow: 0 1px 2px rgba(23, 36, 28, 0.04), 0 8px 24px rgba(23, 36, 28, 0.05);
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  body {
    margin: 0;
    font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, sans-serif;
    background: var(--bg);
    background-image:
      linear-gradient(var(--bg), var(--bg)),
      repeating-linear-gradient(90deg, transparent 0 79px, color-mix(in srgb, var(--court-green) 6%, transparent) 79px 80px);
    background-blend-mode: normal;
    color: var(--ink);
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }
  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 4px;
  }
  header .logo {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: #f7eedf;
    box-shadow: var(--shadow);
    flex-shrink: 0;
    padding: 3px;
  }
  header .logo img { display: block; width: 100%; height: 100%; object-fit: contain; }
  h1 {
    font-size: 1.55rem;
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .sub { color: var(--muted); margin: 6px 0 30px; font-size: 0.93rem; max-width: 62ch; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 22px 24px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .card h2 {
    font-size: 1.02rem;
    margin: 0 0 16px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-weight: 700;
  }
  .step-num {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: var(--court-green);
    background: var(--court-green-soft);
    border-radius: 999px;
    padding: 2px 8px;
    flex-shrink: 0;
  }

  #playerList { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .player-row {
    display: grid;
    grid-template-columns: 24px 1fr auto 32px;
    gap: 10px;
    align-items: center;
  }
  .player-row .idx { color: var(--muted); font-size: 0.82rem; text-align: center; font-weight: 600; }
  input[type="text"] {
    width: 100%;
    padding: 9px 11px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 0.95rem;
    transition: outline-color 0.12s ease;
  }
  input[type="text"]:focus-visible {
    outline: 2px solid var(--court-green);
    outline-offset: -1px;
  }

  .level-picker {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 6px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg);
  }
  .level-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    padding: 0;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .level-dot:hover { transform: scale(1.12); }
  .level-dot:focus-visible { outline: 2px solid var(--court-green); outline-offset: 2px; }
  .level-dot[data-value="1"].filled { background: var(--court-green); border-color: var(--court-green); }
  .level-dot[data-value="2"].filled { background: #4a9a63; border-color: #4a9a63; }
  .level-dot[data-value="3"].filled { background: var(--ball); border-color: var(--ball); }
  .level-dot[data-value="4"].filled { background: #d98a4f; border-color: #d98a4f; }
  .level-dot[data-value="5"].filled { background: var(--clay); border-color: var(--clay); }

  .remove-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .remove-btn:hover { background: color-mix(in srgb, var(--clay) 12%, transparent); border-color: var(--clay); color: var(--clay); }

  .level-legend {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--muted);
    margin: 2px 0 14px;
  }
  .level-legend .lg-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .row-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button.btn {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.12s ease, transform 0.06s ease, opacity 0.12s ease;
  }
  button.btn:active { transform: translateY(1px); }
  button.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink);
  }
  .btn-secondary:hover { background: var(--bg); }
  .btn-primary {
    background: var(--court-green);
    color: white;
  }
  .btn-primary:hover { background: var(--court-green-dark); }
  .btn-accent {
    background: var(--clay);
    color: white;
  }
  .btn-accent:hover:not(:disabled) { background: var(--clay-dark); }

  .options { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 4px; }
  .option-field { display: flex; flex-direction: column; gap: 6px; }
  .option-field label { font-size: 0.82rem; color: var(--muted); }
  .option-field input[type="number"] {
    width: 90px;
    padding: 9px 10px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 0.95rem;
  }
  .option-field input[type="number"]:focus-visible { outline: 2px solid var(--court-green); outline-offset: -1px; }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .round-block { margin-bottom: 18px; animation: rise 0.25s ease both; }
  .round-block:last-child { margin-bottom: 0; }
  .table-scroll { overflow-x: auto; }
  table.match-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
  }
  table.match-table th, table.match-table td {
    text-align: left;
    padding: 9px 8px;
    border-bottom: 1px solid var(--border);
  }
  table.match-table th { color: var(--muted); font-weight: 600; font-size: 0.78rem; }
  table.match-table tbody tr:nth-child(even) { background: color-mix(in srgb, var(--court-green) 4%, transparent); }
  .court-chip {
    display: inline-flex;
    min-width: 1.6em;
    justify-content: center;
    font-weight: 700;
    font-size: 0.78rem;
    color: var(--court-green-dark);
    background: var(--court-green-soft);
    border-radius: 999px;
    padding: 3px 8px;
  }
  .round-label {
    display: inline-block;
    background: var(--court-green);
    color: white;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .rest-note {
    font-size: 0.8rem;
    color: var(--clay-dark);
    margin-bottom: 8px;
  }

  .empty-hint {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 8px 0;
  }

  @media (max-width: 480px) {
    .player-row { grid-template-columns: 20px 1fr auto 30px; gap: 6px; }
    .level-picker { padding: 3px 4px; gap: 4px; }
    .level-dot { width: 18px; height: 18px; }
  }
</style>
</head>

  <p class="sub">선수 이름과 실력 레벨을 입력하면, 매 라운드 파트너를 바꿔가며 실력이 균형 잡힌 대진표를 만들어 드립니다.</p>

  <div class="card">
    <h2><span class="step-num">01</span>선수 명단</h2>
    <div id="playerList"></div>
    <div class="level-legend">
      <span>레벨</span>
      <span class="lg-dot" style="background:var(--court-green)"></span>초급
      <span style="color:var(--border)">—</span>
      <span class="lg-dot" style="background:var(--clay)"></span>상급
    </div>
    <div class="row-actions">
      <button class="btn btn-secondary" id="addPlayerBtn" type="button">+ 선수 추가</button>
      <button class="btn btn-secondary" id="clearBtn" type="button">전체 지우기</button>
    </div>
  </div>

  <div class="card">
    <h2><span class="step-num">02</span>편성 옵션</h2>
    <div class="options">
      <div class="option-field">
        <label for="courtsInput">사용 가능 코트 수</label>
        <input type="number" id="courtsInput" min="1" value="2">
      </div>
      <div class="option-field">
        <label for="gamesInput">인당 보장 경기 수</label>
        <input type="number" id="gamesInput" min="1" placeholder="자동">
      </div>
    </div>
    <div class="row-actions" style="margin-top:18px;">
      <button class="btn btn-accent" id="formScheduleBtn" type="button">대진표 생성하기</button>
    </div>
  </div>

  <div class="card" id="scheduleCard" style="display:none;">
    <h2><span class="step-num">03</span>대진표</h2>
    <div class="row-actions no-capture" style="margin-bottom:14px;">
      <button class="btn btn-secondary" id="reshuffleBtn" type="button">재생성</button>
      <button class="btn btn-secondary" id="saveImageBtn" type="button">이미지로 저장</button>
    </div>
    <div id="scheduleContent"></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  const playerListEl = document.getElementById('playerList');
  const scheduleCard = document.getElementById('scheduleCard');
  const scheduleContent = document.getElementById('scheduleContent');
  const formScheduleBtn = document.getElementById('formScheduleBtn');

  let rowCounter = 0;

  function buildLevelPicker(initialLevel) {
    const picker = document.createElement('div');
    picker.className = 'level-picker';
    picker.setAttribute('role', 'group');
    picker.setAttribute('aria-label', '실력 레벨 (1~5)');
    picker.dataset.level = String(initialLevel);
    for (let v = 1; v <= 5; v++) {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'level-dot';
      dot.dataset.value = String(v);
      dot.setAttribute('aria-label', `레벨 ${v}`);
      dot.addEventListener('click', () => setLevelPicker(picker, v));
      picker.appendChild(dot);
    }
    setLevelPicker(picker, initialLevel);
    return picker;
  }

  function setLevelPicker(picker, value) {
    picker.dataset.level = String(value);
    picker.querySelectorAll('.level-dot').forEach(dot => {
      const v = parseInt(dot.dataset.value, 10);
      dot.classList.toggle('filled', v <= value);
      dot.setAttribute('aria-pressed', v === value ? 'true' : 'false');
    });
  }

  function addPlayerRow(name = '', level = 3) {
    rowCounter += 1;
    const row = document.createElement('div');
    row.className = 'player-row';
    row.dataset.rowId = rowCounter;

    const idx = document.createElement('div');
    idx.className = 'idx';

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.className = 'name-input';
    nameInput.placeholder = '이름';
    nameInput.value = name;

    const picker = buildLevelPicker(level);

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'remove-btn';
    removeBtn.title = '삭제';
    removeBtn.textContent = '×';
    removeBtn.addEventListener('click', () => {
      row.remove();
      renumberRows();
    });

    row.append(idx, nameInput, picker, removeBtn);
    playerListEl.appendChild(row);
    renumberRows();
  }

  function renumberRows() {
    const rows = playerListEl.querySelectorAll('.player-row');
    rows.forEach((row, i) => {
      row.querySelector('.idx').textContent = i + 1;
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function getPlayers() {
    const rows = playerListEl.querySelectorAll('.player-row');
    const players = [];
    rows.forEach(row => {
      const name = row.querySelector('.name-input').value.trim();
      const level = parseInt(row.querySelector('.level-picker').dataset.level, 10);
      if (name && !isNaN(level)) {
        players.push({ name, level });
      }
    });
    return players;
  }

  document.getElementById('addPlayerBtn').addEventListener('click', () => addPlayerRow());

  document.getElementById('clearBtn').addEventListener('click', () => {
    playerListEl.innerHTML = '';
    scheduleCard.style.display = 'none';
  });

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function generateSchedule() {
    const players = getPlayers();
    if (players.length < 4) {
      alert('최소 4명 이상의 선수를 입력해주세요.');
      return false;
    }
    const courts = Math.max(1, parseInt(document.getElementById('courtsInput').value) || 1);
    const targetGames = parseInt(document.getElementById('gamesInput').value) || 4;
    const { rounds, courtsUsed } = buildRotatingSchedule(shuffle(players), courts, targetGames);
    renderSchedule(rounds, players.length, courts, courtsUsed);
    return true;
  }

  document.getElementById('formScheduleBtn').addEventListener('click', () => {
    if (!generateSchedule()) return;
    scheduleCard.style.display = 'block';
    scheduleCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

  document.getElementById('reshuffleBtn').addEventListener('click', () => {
    generateSchedule();
  });

  document.getElementById('saveImageBtn').addEventListener('click', () => {
    const cardStyle = getComputedStyle(scheduleCard);
    html2canvas(scheduleCard, {
      backgroundColor: cardStyle.backgroundColor,
      ignoreElements: el => el.classList && el.classList.contains('no-capture')
    }).then(canvas => {
      const link = document.createElement('a');
      const today = new Date().toISOString().slice(0, 10);
      link.download = `대진표_${today}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  });

  // every round, the players who've played the most (and rested the least) sit out,
  // and everyone still on court gets a fresh partner each time.
  function buildRotatingSchedule(players, courts, targetGames) {
    const courtsUsed = Math.min(courts, Math.floor(players.length / 4));
    if (courtsUsed < 1) return { rounds: [], courtsUsed: 0 };

    const perRound = courtsUsed * 4;
    const gamesPlayed = new Map(players.map(p => [p.name, 0]));
    const restsSoFar = new Map(players.map(p => [p.name, 0]));
    const partnerHistory = new Map(players.map(p => [p.name, new Set()]));
    // 이름 표기 순서(포/백 자리)가 한쪽으로 쏠리지 않도록 포 자리 배정 횟수를 추적
    const frontCount = new Map(players.map(p => [p.name, 0]));

    const rounds = [];
    let safety = 300;
    while (players.some(p => gamesPlayed.get(p.name) < targetGames) && safety-- > 0) {
      const order = [...players].sort((a, b) => {
        const byGames = gamesPlayed.get(b.name) - gamesPlayed.get(a.name);
        if (byGames !== 0) return byGames;
        return restsSoFar.get(a.name) - restsSoFar.get(b.name);
      });
      const restCount = players.length - perRound;
      const resting = order.slice(0, restCount);
      const playing = order.slice(restCount);
      resting.forEach(p => restsSoFar.set(p.name, restsSoFar.get(p.name) + 1));

      const rawMatches = formRoundMatches(playing, partnerHistory);
      const matches = rawMatches.map(([teamA, teamB]) => {
        const orderedA = orderByFrontBack(teamA, frontCount);
        const orderedB = orderByFrontBack(teamB, frontCount);
        [...orderedA, ...orderedB].forEach(p => gamesPlayed.set(p.name, gamesPlayed.get(p.name) + 1));
        partnerHistory.get(orderedA[0].name).add(orderedA[1].name);
        partnerHistory.get(orderedA[1].name).add(orderedA[0].name);
        partnerHistory.get(orderedB[0].name).add(orderedB[1].name);
        partnerHistory.get(orderedB[1].name).add(orderedB[0].name);
        return [orderedA, orderedB];
      });

      rounds.push({ matches, resting });
    }
    return { rounds, courtsUsed };
  }

  // decides which of the pair goes first (포) vs second (백): whoever has been
  // placed in the 포 spot less often so far gets it this time.
  function orderByFrontBack(pair, frontCount) {
    const [x, y] = pair;
    const front = frontCount.get(x.name) <= frontCount.get(y.name) ? x : y;
    const back = front === x ? y : x;
    frontCount.set(front.name, frontCount.get(front.name) + 1);
    return [front, back];
  }

  // pairs players for one round only (snake by level), preferring partners not used before
  function formRoundMatches(playing, partnerHistory) {
    const pool = [...playing].sort((a, b) => b.level - a.level);
    const used = new Set();
    const teams = [];

    while (used.size < pool.length) {
      const a = pool.find(p => !used.has(p.name));
      used.add(a.name);
      const remaining = pool.filter(p => !used.has(p.name)).sort((x, y) => x.level - y.level);
      const partner = remaining.find(p => !partnerHistory.get(a.name).has(p.name)) || remaining[0];
      used.add(partner.name);
      teams.push([a, partner]);
    }

    const bySum = [...teams].sort((t1, t2) => (t2[0].level + t2[1].level) - (t1[0].level + t1[1].level));
    const matches = [];
    for (let i = 0; i < bySum.length / 2; i++) {
      matches.push([bySum[i], bySum[bySum.length - 1 - i]]);
    }
    return matches;
  }

  function renderSchedule(rounds, totalPlayers, courts, courtsUsed) {
    if (rounds.length === 0) {
      scheduleContent.innerHTML = `<p class="empty-hint">코트 1개당 4명이 필요합니다. 인원(${totalPlayers}명)이나 코트 수를 확인해주세요.</p>`;
      return;
    }
    let html = '';
    if (courtsUsed < courts) {
      html += `<p class="empty-hint">인원이 부족해 코트 ${courtsUsed}개만 사용합니다.</p>`;
    }
    rounds.forEach((round, ri) => {
      html += `<div class="round-block">`;
      html += `<span class="round-label">ROUND ${ri + 1}</span>`;
      if (round.resting.length > 0) {
        html += `<div class="rest-note">휴식: ${round.resting.map(p => escapeHtml(p.name)).join(' · ')}</div>`;
      }
      html += `<div class="table-scroll"><table class="match-table"><thead><tr><th>코트</th><th>대진</th></tr></thead><tbody>`;
      round.matches.forEach((m, mi) => {
        const teamA = `${escapeHtml(m[0][0].name)} · ${escapeHtml(m[0][1].name)}`;
        const teamB = `${escapeHtml(m[1][0].name)} · ${escapeHtml(m[1][1].name)}`;
        html += `<tr><td><span class="court-chip">${mi + 1}</span></td><td>${teamA} <strong>vs</strong> ${teamB}</td></tr>`;
      });
      html += `</tbody></table></div></div>`;
    });
    scheduleContent.innerHTML = html;
  }

  // default roster
  const defaultPlayers = [
    ['안유현', 3], ['우대원', 4], ['권수기', 3], ['남택원', 4],
    ['김종해', 3], ['이병일', 3], ['류병기', 4], ['서승훈', 3],
    ['신동휘', 4], ['이정훈', 3], ['이희영', 4], ['최영열', 2],
    ['허영주', 2]
  ];
  defaultPlayers.forEach(([n, l]) => addPlayerRow(n, l));
</script>
</body>
</html>
