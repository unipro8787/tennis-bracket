<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테니스 복식조 편성기</title>
<style>
  :root {
    --court-green: #1f7a4d;
    --court-green-dark: #145c39;
    --court-green-soft: #e4f1e9;
    --line-white: #f5f5f0;
    --clay: #c1542c;
    --clay-dark: #9c4020;
    --ball: #c7d94a;
    --ink: #17241c;
    --muted: #5f6f66;
    --bg: #f2f6f1;
    --card-bg: #ffffff;
    --border: #dde4da;
    --shadow: 0 1px 2px rgba(23, 36, 28, 0.04), 0 8px 24px rgba(23, 36, 28, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --court-green-soft: #163425;
      --bg: #10160f;
      --card-bg: #182018;
      --ink: #e9f0e6;
      --muted: #97a89d;
      --border: #293429;
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.24);
    }
  }
  :root[data-theme="dark"] {
    --court-green-soft: #163425;
    --bg: #10160f;
    --card-bg: #182018;
    --ink: #e9f0e6;
    --muted: #97a89d;
    --border: #293429;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.24);
  }
  :root[data-theme="light"] {
    --court-green-soft: #e4f1e9;
    --bg: #f2f6f1;
    --card-bg: #ffffff;
    --ink: #17241c;
    --muted: #5f6f66;
    --border: #dde4da;
    --shadow: 0 1px 2px rgba(23, 36, 28, 0.04), 0 8px 24px rgba(23, 36, 28, 0.05);
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  body {
    margin: 0;
    font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, sans-serif;
    background: var(--bg);
    background-image:
      linear-gradient(var(--bg), var(--bg)),
      repeating-linear-gradient(90deg, transparent 0 79px, rgba(31, 122, 77, 0.06) 79px 80px);
    background-blend-mode: normal;
    color: var(--ink);
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }
  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 4px;
  }
  header .logo {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: #f7eedf;
    box-shadow: var(--shadow);
    flex-shrink: 0;
    padding: 3px;
  }
  header .logo img { display: block; width: 100%; height: 100%; object-fit: contain; }
  h1 {
    font-size: 1.55rem;
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .sub { color: var(--muted); margin: 6px 0 30px; font-size: 0.93rem; max-width: 62ch; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 22px 24px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .card h2 {
    font-size: 1.02rem;
    margin: 0 0 16px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-weight: 700;
  }
  .step-num {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: var(--court-green);
    background: var(--court-green-soft);
    border-radius: 999px;
    padding: 2px 8px;
    flex-shrink: 0;
  }
  .generated-at {
    margin-left: auto;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted);
  }

  #playerList { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .player-row {
    display: grid;
    grid-template-columns: 24px 1fr auto 32px;
    gap: 10px;
    align-items: center;
  }
  .player-row .idx { color: var(--muted); font-size: 0.82rem; text-align: center; font-weight: 600; }
  input[type="text"] {
    width: 100%;
    padding: 9px 11px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 0.95rem;
    transition: outline-color 0.12s ease;
  }
  input[type="text"]:focus-visible {
    outline: 2px solid var(--court-green);
    outline-offset: -1px;
  }

  .level-picker {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 6px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg);
  }
  .level-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    padding: 0;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .level-dot:hover { transform: scale(1.12); }
  .level-dot:focus-visible { outline: 2px solid var(--court-green); outline-offset: 2px; }
  .level-dot[data-value="1"].filled { background: var(--court-green); border-color: var(--court-green); }
  .level-dot[data-value="2"].filled { background: #4a9a63; border-color: #4a9a63; }
  .level-dot[data-value="3"].filled { background: var(--ball); border-color: var(--ball); }
  .level-dot[data-value="4"].filled { background: #d98a4f; border-color: #d98a4f; }
  .level-dot[data-value="5"].filled { background: var(--clay); border-color: var(--clay); }

  .remove-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  }
  .remove-btn:hover { background: rgba(193, 84, 44, 0.12); border-color: var(--clay); color: var(--clay); }

  .level-legend {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: var(--muted);
    margin: 2px 0 14px;
  }
  .level-legend .lg-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .row-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button.btn {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.12s ease, transform 0.06s ease, opacity 0.12s ease;
  }
  button.btn:active { transform: translateY(1px); }
  button.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink);
  }
  .btn-secondary:hover { background: var(--bg); }
  .btn-primary {
    background: var(--court-green);
    color: white;
  }
  .btn-primary:hover { background: var(--court-green-dark); }
  .btn-accent {
    background: var(--clay);
    color: white;
  }
  .btn-accent:hover:not(:disabled) { background: var(--clay-dark); }

  .options { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 4px; }
  .option-field { display: flex; flex-direction: column; gap: 6px; }
  .option-field label { font-size: 0.82rem; color: var(--muted); }
  .option-field input[type="number"] {
    width: 90px;
    padding: 9px 10px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 0.95rem;
  }
  .option-field input[type="number"]:focus-visible { outline: 2px solid var(--court-green); outline-offset: -1px; }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .round-block { margin-bottom: 18px; animation: rise 0.25s ease both; }
  .round-block:last-child { margin-bottom: 0; }
  .table-scroll { overflow-x: auto; }
  table.match-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
  }
  table.match-table th, table.match-table td {
    text-align: left;
    padding: 9px 8px;
    border-bottom: 1px solid var(--border);
  }
  table.match-table th { color: var(--muted); font-weight: 600; font-size: 0.78rem; }
  table.match-table td:nth-child(2) { white-space: nowrap; }
  table.match-table td:last-child { width: 1%; padding-left: 2px; padding-right: 4px; }
  table.match-table tbody tr:nth-child(even) { background: rgba(31, 122, 77, 0.04); }
  .court-chip {
    display: inline-flex;
    min-width: 1.6em;
    justify-content: center;
    font-weight: 700;
    font-size: 0.78rem;
    color: var(--court-green-dark);
    background: var(--court-green-soft);
    border-radius: 999px;
    padding: 3px 8px;
  }
  .round-label {
    display: inline-block;
    background: var(--court-green);
    color: white;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .rest-note {
    font-size: 0.8rem;
    color: var(--clay-dark);
    margin-bottom: 8px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
  }
  .edit-hint {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .player-chip {
    display: inline-block;
    cursor: pointer;
    border-radius: 6px;
    padding: 1px 4px;
    margin: -1px -4px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .player-chip:hover { background: var(--court-green-soft); }
  .player-chip.selected { background: var(--court-green); color: #fff; }
  .player-chip.drag-over { outline: 2px dashed var(--clay); outline-offset: 1px; }
  .delete-match-btn {
    border: none;
    background: transparent;
    color: var(--clay);
    cursor: pointer;
    font-size: 0.7rem;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 6px;
  }
  .delete-match-btn:hover { background: var(--clay); color: #fff; }

  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 4px 20px;
    align-items: start;
  }
  .result-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 5px 4px;
    border-bottom: 1px solid var(--border);
  }
  .result-row .matchup {
    flex: 1;
    min-width: 0;
    font-size: 0.78rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .score-pair {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .score-sep { color: var(--muted); font-weight: 700; font-size: 0.8rem; }
  .score-pair .score-box {
    width: 24px;
    padding: 3px 1px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    font-size: 0.8rem;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .empty-hint {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 8px 0;
  }

  @media (max-width: 480px) {
    .player-row { grid-template-columns: 20px 1fr auto 30px; gap: 6px; }
    .level-picker { padding: 3px 4px; gap: 4px; }
    .level-dot { width: 18px; height: 18px; }
    table.match-table { font-size: 0.78rem; }
    table.match-table th, table.match-table td { padding: 7px 5px; }
    .delete-match-btn { font-size: 0.62rem; padding: 2px 4px; }
  }
</style>
</head>

    <h1>테니스 복식조 편성기</h1>
  </header>
  <p class="sub">선수 이름과 실력 레벨을 입력하면, 매 라운드 파트너를 바꿔가며 균형 잡힌 대진표를 만들어 드립니다.</p>

  <div class="card">
    <h2><span class="step-num">01</span>선수 명단</h2>
    <div id="playerList"></div>
    <div class="level-legend">
      <span>레벨</span>
      <span class="lg-dot" style="background:var(--court-green)"></span>초급
      <span style="color:var(--border)">—</span>
      <span class="lg-dot" style="background:var(--clay)"></span>상급
    </div>
    <div class="row-actions">
      <button class="btn btn-secondary" id="resetPlayersBtn" type="button">초기화</button>
      <button class="btn btn-secondary" id="addPlayerBtn" type="button">+ 선수 추가</button>
      <button class="btn btn-secondary" id="clearBtn" type="button">전체 지우기</button>
    </div>
  </div>

  <div class="card">
    <h2><span class="step-num">02</span>편성 옵션</h2>
    <div class="options">
      <div class="option-field">
        <label for="courtsInput">사용 가능 코트 수</label>
        <input type="number" id="courtsInput" min="1" value="2">
      </div>
      <div class="option-field">
        <label for="gamesInput">인당 보장 경기 수</label>
        <input type="number" id="gamesInput" min="1" value="3" placeholder="자동">
      </div>
    </div>
    <div class="row-actions" style="margin-top:18px;">
      <button class="btn btn-accent" id="formScheduleBtn" type="button">대진표 생성하기</button>
    </div>
  </div>

  <div class="card" id="scheduleCard" style="display:none;">
    <h2><span class="step-num">03</span>대진표<span id="scheduleGeneratedAt" class="generated-at"></span></h2>
    <div class="row-actions no-capture" style="margin-bottom:14px;">
      <button class="btn btn-secondary" id="reshuffleBtn" type="button">재생성</button>
      <button class="btn btn-secondary" id="saveImageBtn" type="button">이미지로 저장</button>
    </div>
    <div id="scheduleContent"></div>
  </div>

  <div class="card" id="resultsCard" style="display:none;">
    <h2><span class="step-num">04</span>경기 결과 입력</h2>
    <div id="resultsContent"></div>
    <div class="row-actions" style="margin-top:14px; align-items:center;">
      <button class="btn btn-secondary" id="saveResultsBtn" type="button">결과 텍스트로 저장</button>
      <button class="btn btn-secondary" id="viewStatsBtn" type="button" style="display:none;">통계 보기</button>
      <span id="resultsSaveStatus" style="font-size:0.82rem; color:var(--muted);"></span>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  const playerListEl = document.getElementById('playerList');
  const scheduleCard = document.getElementById('scheduleCard');
  const scheduleContent = document.getElementById('scheduleContent');
  const formScheduleBtn = document.getElementById('formScheduleBtn');
  const resultsCard = document.getElementById('resultsCard');
  const resultsContent = document.getElementById('resultsContent');

  const STORAGE_KEY = 'tennisBracketState_v1';

  const DEFAULT_PLAYERS = [
    ['안유현', 3], ['우대원', 4], ['권수기', 3], ['남택원', 4],
    ['김종해', 3], ['이병일', 3], ['류병기', 4], ['서승훈', 3],
    ['신동휘', 4], ['이정훈', 3], ['이희영', 4], ['최영열', 2],
    ['허영주', 2]
  ];

  // Cloudflare Worker endpoint that commits results to the GitHub repo.
  // Fill this in after deploying worker/results-committer.js — see worker/README.md.
  const RESULTS_WORKER_URL = 'https://tennis-bracket-results.unipro8787.workers.dev';

  // Sends the results text to the Worker, which holds the GitHub token server-side
  // and commits it to results/<date>.txt — no token is ever present in this page.
  async function commitResultsToGit(text) {
    if (!RESULTS_WORKER_URL) return { skipped: true };
    try {
      const resp = await fetch(RESULTS_WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      return { ok: resp.ok };
    } catch (err) {
      return { ok: false };
    }
  }

  let rowCounter = 0;
  let lastRounds = [];
  let resultsState = {};
  let lastTotalPlayers = 0;
  let lastCourts = 1;
  let lastCourtsUsed = 0;
  let lastGeneratedAt = null;

  function formatGeneratedAt(date) {
    const pad = n => String(n).padStart(2, '0');
    return `${date.getFullYear()}.${pad(date.getMonth() + 1)}.${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())} 생성`;
  }

  function renderGeneratedAt() {
    const el = document.getElementById('scheduleGeneratedAt');
    el.textContent = lastGeneratedAt ? formatGeneratedAt(lastGeneratedAt) : '';
  }

  // builds the full snapshot needed to restore the page (roster, schedule, scores)
  function buildStateObject() {
    const players = [...playerListEl.querySelectorAll('.player-row')].map(row => ({
      rowId: row.dataset.rowId,
      name: row.querySelector('.name-input').value,
      level: parseInt(row.querySelector('.level-picker').dataset.level, 10)
    }));
    return {
      players,
      courts: document.getElementById('courtsInput').value,
      games: document.getElementById('gamesInput').value,
      scheduleVisible: scheduleCard.style.display !== 'none',
      resultsVisible: resultsCard.style.display !== 'none',
      lastTotalPlayers,
      lastCourts,
      lastCourtsUsed,
      lastGeneratedAt: lastGeneratedAt ? lastGeneratedAt.toISOString() : null,
      rounds: lastRounds.map(r => ({
        matches: r.matches.map(m => m.map(team => team.map(p => p.rowId))),
        resting: r.resting.map(p => p.rowId)
      })),
      resultsState
    };
  }

  // saves locally (instant, survives offline/backgrounded tabs) and pushes the
  // same snapshot to the shared Worker/KV store so every browser — including
  // separate storage sandboxes like the KakaoTalk in-app browser vs. Safari —
  // ends up showing the same roster/schedule/scores.
  function saveState() {
    const state = buildStateObject();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      // private-mode / quota errors: local copy just won't persist
    }
    scheduleServerSync(state);
  }

  let serverSyncTimer = null;
  function scheduleServerSync(state) {
    if (!RESULTS_WORKER_URL) return;
    clearTimeout(serverSyncTimer);
    // debounced so rapid edits (typing a name, clicking level dots) don't
    // spam the Worker with a request per keystroke
    serverSyncTimer = setTimeout(() => pushStateToServer(state), 600);
  }

  async function pushStateToServer(state) {
    try {
      await fetch(`${RESULTS_WORKER_URL}/state`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(state),
      });
    } catch (err) {
      // offline or blocked — the local copy above still covers this device
    }
  }

  async function fetchServerState() {
    if (!RESULTS_WORKER_URL) return null;
    try {
      const resp = await fetch(`${RESULTS_WORKER_URL}/state`);
      if (!resp.ok) return null;
      return await resp.json();
    } catch (err) {
      return null;
    }
  }

  // rebuilds player rows and reconstructs schedule/result state from a saved
  // snapshot (either the local copy or the shared server copy), preserving
  // shared player-object identity (by rowId) across rounds.
  function applyState(state) {
    if (!state || !Array.isArray(state.players) || state.players.length === 0) return false;

    playerListEl.innerHTML = '';
    rowCounter = 0;
    state.players.forEach(p => addPlayerRow(p.name, p.level, p.rowId));

    const playerByRowId = new Map();
    playerListEl.querySelectorAll('.player-row').forEach(row => {
      playerByRowId.set(row.dataset.rowId, {
        name: row.querySelector('.name-input').value,
        level: parseInt(row.querySelector('.level-picker').dataset.level, 10),
        rowId: row.dataset.rowId
      });
    });

    if (state.courts) document.getElementById('courtsInput').value = state.courts;
    if (state.games) document.getElementById('gamesInput').value = state.games;

    lastRounds = (state.rounds || []).map(r => ({
      matches: r.matches.map(m => m.map(team => team.map(rowId => playerByRowId.get(String(rowId))))),
      resting: r.resting.map(rowId => playerByRowId.get(String(rowId)))
    })).filter(r => r.matches.every(m => m.every(team => team.every(Boolean))) && r.resting.every(Boolean));

    lastTotalPlayers = state.lastTotalPlayers || 0;
    lastCourts = state.lastCourts || 1;
    lastCourtsUsed = state.lastCourtsUsed || 0;
    lastGeneratedAt = state.lastGeneratedAt ? new Date(state.lastGeneratedAt) : null;
    resultsState = state.resultsState || {};
    renderGeneratedAt();

    if (lastRounds.length > 0 && state.scheduleVisible) {
      renderSchedule(lastRounds, lastTotalPlayers, lastCourts, lastCourtsUsed);
      scheduleCard.style.display = 'block';
    } else {
      scheduleCard.style.display = 'none';
    }
    if (lastRounds.length > 0 && state.resultsVisible) {
      renderResultsInput(lastRounds);
      resultsCard.style.display = 'block';
    } else {
      resultsCard.style.display = 'none';
    }

    return true;
  }

  function restoreState() {
    let raw;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch (err) {
      return false;
    }
    if (!raw) return false;
    let state;
    try {
      state = JSON.parse(raw);
    } catch (err) {
      return false;
    }
    return applyState(state);
  }

  function buildLevelPicker(initialLevel) {
    const picker = document.createElement('div');
    picker.className = 'level-picker';
    picker.setAttribute('role', 'group');
    picker.setAttribute('aria-label', '실력 레벨 (1~5)');
    picker.dataset.level = String(initialLevel);
    for (let v = 1; v <= 5; v++) {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'level-dot';
      dot.dataset.value = String(v);
      dot.setAttribute('aria-label', `레벨 ${v}`);
      dot.addEventListener('click', () => setLevelPicker(picker, v));
      picker.appendChild(dot);
    }
    setLevelPicker(picker, initialLevel);
    return picker;
  }

  function setLevelPicker(picker, value) {
    picker.dataset.level = String(value);
    picker.querySelectorAll('.level-dot').forEach(dot => {
      const v = parseInt(dot.dataset.value, 10);
      dot.classList.toggle('filled', v <= value);
      dot.setAttribute('aria-pressed', v === value ? 'true' : 'false');
    });
  }

  function addPlayerRow(name = '', level = 3, forcedRowId = null) {
    let id;
    if (forcedRowId !== null && forcedRowId !== undefined) {
      id = String(forcedRowId);
      const n = parseInt(forcedRowId, 10);
      if (!isNaN(n)) rowCounter = Math.max(rowCounter, n);
    } else {
      rowCounter += 1;
      id = String(rowCounter);
    }
    const row = document.createElement('div');
    row.className = 'player-row';
    row.dataset.rowId = id;

    const idx = document.createElement('div');
    idx.className = 'idx';

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.className = 'name-input';
    nameInput.placeholder = '이름';
    nameInput.value = name;
    nameInput.addEventListener('input', () => saveState());

    const picker = buildLevelPicker(level);
    picker.addEventListener('click', () => saveState());

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'remove-btn';
    removeBtn.title = '삭제';
    removeBtn.textContent = '×';
    removeBtn.addEventListener('click', () => {
      row.remove();
      renumberRows();
      saveState();
    });

    row.append(idx, nameInput, picker, removeBtn);
    playerListEl.appendChild(row);
    renumberRows();
  }

  function renumberRows() {
    const rows = playerListEl.querySelectorAll('.player-row');
    rows.forEach((row, i) => {
      row.querySelector('.idx').textContent = i + 1;
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function getPlayers() {
    const rows = playerListEl.querySelectorAll('.player-row');
    const players = [];
    rows.forEach(row => {
      const name = row.querySelector('.name-input').value.trim();
      const level = parseInt(row.querySelector('.level-picker').dataset.level, 10);
      if (name && !isNaN(level)) {
        players.push({ name, level, rowId: row.dataset.rowId });
      }
    });
    return players;
  }

  document.getElementById('addPlayerBtn').addEventListener('click', () => {
    addPlayerRow();
    saveState();
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    playerListEl.innerHTML = '';
    scheduleCard.style.display = 'none';
    resultsCard.style.display = 'none';
    lastRounds = [];
    resultsState = {};
    lastTotalPlayers = 0;
    lastCourtsUsed = 0;
    lastGeneratedAt = null;
    renderGeneratedAt();
    saveState();
  });

  document.getElementById('resetPlayersBtn').addEventListener('click', () => {
    playerListEl.innerHTML = '';
    scheduleCard.style.display = 'none';
    resultsCard.style.display = 'none';
    lastRounds = [];
    resultsState = {};
    lastTotalPlayers = 0;
    lastCourtsUsed = 0;
    lastGeneratedAt = null;
    renderGeneratedAt();
    DEFAULT_PLAYERS.forEach(([n, l]) => addPlayerRow(n, l));
    saveState();
  });

  document.getElementById('courtsInput').addEventListener('input', () => saveState());
  document.getElementById('gamesInput').addEventListener('input', () => saveState());

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function generateSchedule() {
    const players = getPlayers();
    if (players.length < 4) {
      alert('최소 4명 이상의 선수를 입력해주세요.');
      return false;
    }
    const courts = Math.max(1, parseInt(document.getElementById('courtsInput').value) || 1);
    const targetGames = parseInt(document.getElementById('gamesInput').value) || 3;
    const { rounds, courtsUsed } = buildRotatingSchedule(shuffle(players), courts, targetGames);
    renderSchedule(rounds, players.length, courts, courtsUsed);

    lastRounds = rounds;
    lastTotalPlayers = players.length;
    lastCourts = courts;
    lastCourtsUsed = courtsUsed;
    lastGeneratedAt = new Date();
    renderGeneratedAt();
    resultsState = {};
    renderResultsInput(rounds);
    resultsCard.style.display = 'block';
    saveState();
    return true;
  }

  document.getElementById('formScheduleBtn').addEventListener('click', () => {
    if (!generateSchedule()) return;
    scheduleCard.style.display = 'block';
    saveState();
    scheduleCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

  document.getElementById('reshuffleBtn').addEventListener('click', () => {
    generateSchedule();
    scheduleCard.style.display = 'block';
    saveState();
  });

  // lays every round out in a grid (instead of one long vertical strip) so the
  // whole schedule reads as a single poster-like image at a glance.
  function buildScheduleCaptureEl() {
    const blocks = [...scheduleContent.querySelectorAll('.round-block')];
    const cols = Math.max(1, Math.min(4, Math.ceil(Math.sqrt(blocks.length))));
    const colWidth = 300;
    const gap = 16;
    const pad = 24;

    const pageStyle = getComputedStyle(document.body);
    const cardStyle = getComputedStyle(scheduleCard);

    const wrap = document.createElement('div');
    wrap.style.position = 'fixed';
    wrap.style.top = '0';
    wrap.style.left = '-99999px';
    wrap.style.width = `${cols * colWidth + (cols - 1) * gap + pad * 2}px`;
    wrap.style.padding = `${pad}px`;
    wrap.style.background = cardStyle.backgroundColor;
    wrap.style.color = pageStyle.color;
    wrap.style.fontFamily = pageStyle.fontFamily;

    const title = document.createElement('div');
    title.style.cssText = 'display:flex;align-items:baseline;gap:10px;margin-bottom:16px;';
    const titleText = document.createElement('span');
    titleText.textContent = '대진표';
    titleText.style.cssText = 'font-size:22px;font-weight:800;';
    title.appendChild(titleText);
    if (lastGeneratedAt) {
      const titleDate = document.createElement('span');
      titleDate.textContent = formatGeneratedAt(lastGeneratedAt);
      titleDate.style.cssText = `font-size:13px;font-weight:500;color:${pageStyle.getPropertyValue('--muted') || pageStyle.color};`;
      title.appendChild(titleDate);
    }
    wrap.appendChild(title);

    const grid = document.createElement('div');
    grid.style.cssText = `display:grid;grid-template-columns:repeat(${cols}, 1fr);gap:${gap}px;align-items:start;`;
    blocks.forEach(block => {
      const clone = block.cloneNode(true);
      // cloned nodes replay the round-block fade-in animation from scratch;
      // freeze it so html2canvas doesn't capture a mid-fade (near-invisible) frame
      clone.style.animation = 'none';
      clone.style.opacity = '1';
      // strip edit-only controls (delete buttons etc.) so they don't show up in the saved image
      clone.querySelectorAll('.no-capture').forEach(el => el.remove());
      grid.appendChild(clone);
    });
    wrap.appendChild(grid);

    document.body.appendChild(wrap);
    return wrap;
  }

  // full-screen preview so the user can long-press (mobile) or right-click (desktop)
  // to save the image — this works even in restrictive in-app browsers where
  // share/download APIs are blocked or silently fail.
  function openImagePreview(dataUrl) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(10,14,10,0.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;';

    const hint = document.createElement('div');
    hint.textContent = '이미지를 길게 누르거나(모바일) 우클릭(PC)해서 저장하세요';
    hint.style.cssText = 'color:#fff;font-size:0.9rem;text-align:center;';

    const img = document.createElement('img');
    img.src = dataUrl;
    img.alt = '대진표';
    img.style.cssText = 'max-width:100%;max-height:70vh;border-radius:10px;background:#fff;';

    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.textContent = '닫기';
    closeBtn.className = 'btn btn-secondary';
    closeBtn.addEventListener('click', () => overlay.remove());

    overlay.append(hint, img, closeBtn);
    document.body.appendChild(overlay);
  }

  document.getElementById('saveImageBtn').addEventListener('click', () => {
    const captureEl = buildScheduleCaptureEl();
    const bg = getComputedStyle(scheduleCard).backgroundColor;
    html2canvas(captureEl, { backgroundColor: bg }).then(canvas => {
      document.body.removeChild(captureEl);
      const dataUrl = canvas.toDataURL('image/png');
      const today = new Date().toISOString().slice(0, 10);
      const filename = `대진표_${today}.png`;

      canvas.toBlob(async blob => {
        const file = new File([blob], filename, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file] });
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }
        }
        openImagePreview(dataUrl);
      }, 'image/png');
    });
  });

  // every round, the players who've played the most (and rested the least) sit out,
  // and everyone still on court gets a fresh partner each time.
  function buildRotatingSchedule(players, courts, targetGames) {
    const courtsUsed = Math.min(courts, Math.floor(players.length / 4));
    if (courtsUsed < 1) return { rounds: [], courtsUsed: 0 };

    const perRound = courtsUsed * 4;
    const gamesPlayed = new Map(players.map(p => [p.name, 0]));
    const restsSoFar = new Map(players.map(p => [p.name, 0]));
    const partnerHistory = new Map(players.map(p => [p.name, new Set()]));
    // 이름 표기 순서(포/백 자리)가 한쪽으로 쏠리지 않도록 포 자리 배정 횟수를 추적
    const frontCount = new Map(players.map(p => [p.name, 0]));

    const rounds = [];
    let safety = 300;
    while (players.some(p => gamesPlayed.get(p.name) < targetGames) && safety-- > 0) {
      const order = [...players].sort((a, b) => {
        const byGames = gamesPlayed.get(b.name) - gamesPlayed.get(a.name);
        if (byGames !== 0) return byGames;
        return restsSoFar.get(a.name) - restsSoFar.get(b.name);
      });
      const restCount = players.length - perRound;
      const resting = order.slice(0, restCount);
      const playing = order.slice(restCount);
      resting.forEach(p => restsSoFar.set(p.name, restsSoFar.get(p.name) + 1));

      const rawMatches = formRoundMatches(playing, partnerHistory);
      const matches = rawMatches.map(([teamA, teamB]) => {
        const orderedA = orderByFrontBack(teamA, frontCount);
        const orderedB = orderByFrontBack(teamB, frontCount);
        [...orderedA, ...orderedB].forEach(p => gamesPlayed.set(p.name, gamesPlayed.get(p.name) + 1));
        partnerHistory.get(orderedA[0].name).add(orderedA[1].name);
        partnerHistory.get(orderedA[1].name).add(orderedA[0].name);
        partnerHistory.get(orderedB[0].name).add(orderedB[1].name);
        partnerHistory.get(orderedB[1].name).add(orderedB[0].name);
        return [orderedA, orderedB];
      });

      rounds.push({ matches, resting });
    }
    return { rounds, courtsUsed };
  }

  // decides which of the pair goes first (포) vs second (백): whoever has been
  // placed in the 포 spot less often so far gets it this time.
  function orderByFrontBack(pair, frontCount) {
    const [x, y] = pair;
    const front = frontCount.get(x.name) <= frontCount.get(y.name) ? x : y;
    const back = front === x ? y : x;
    frontCount.set(front.name, frontCount.get(front.name) + 1);
    return [front, back];
  }

  // pairs players for one round only (snake by level), preferring partners not used before
  function formRoundMatches(playing, partnerHistory) {
    const pool = [...playing].sort((a, b) => b.level - a.level);
    const used = new Set();
    const teams = [];

    while (used.size < pool.length) {
      const a = pool.find(p => !used.has(p.name));
      used.add(a.name);
      const remaining = pool.filter(p => !used.has(p.name)).sort((x, y) => x.level - y.level);
      const partner = remaining.find(p => !partnerHistory.get(a.name).has(p.name)) || remaining[0];
      used.add(partner.name);
      teams.push([a, partner]);
    }

    const bySum = [...teams].sort((t1, t2) => (t2[0].level + t2[1].level) - (t1[0].level + t1[1].level));
    const matches = [];
    for (let i = 0; i < bySum.length / 2; i++) {
      matches.push([bySum[i], bySum[bySum.length - 1 - i]]);
    }
    return matches;
  }

  // chip = data-loc="ri,mi,team,slot" for a playing slot, or data-loc="ri,rest,idx" for a resting player
  function chipHtml(name, loc) {
    return `<span class="player-chip" draggable="true" data-loc="${loc}">${escapeHtml(name)}</span>`;
  }

  function renderSchedule(rounds, totalPlayers, courts, courtsUsed) {
    if (rounds.length === 0) {
      scheduleContent.innerHTML = `<p class="empty-hint">코트 1개당 4명이 필요합니다. 인원(${totalPlayers}명)이나 코트 수를 확인해주세요.</p>`;
      return;
    }
    let html = '';
    if (courtsUsed < courts) {
      html += `<p class="empty-hint">인원이 부족해 코트 ${courtsUsed}개만 사용합니다.</p>`;
    }
    html += `<p class="edit-hint">선수를 드래그하거나(PC) 두 번 탭해서(모바일) 자리를 맞바꿀 수 있고, 더블클릭하면 이름을 수정할 수 있어요. 게임을 지우려면 휴지통 아이콘을 누르세요.</p>`;
    rounds.forEach((round, ri) => {
      html += `<div class="round-block">`;
      html += `<span class="round-label">ROUND ${ri + 1}</span>`;
      if (round.resting.length > 0) {
        const restChips = round.resting.map((p, idx) => chipHtml(p.name, `${ri},rest,${idx}`)).join(' · ');
        html += `<div class="rest-note">휴식: ${restChips}</div>`;
      }
      html += `<div class="table-scroll"><table class="match-table"><thead><tr><th>코트</th><th>대진</th><th class="no-capture"></th></tr></thead><tbody>`;
      round.matches.forEach((m, mi) => {
        const teamA = `${chipHtml(m[0][0].name, `${ri},${mi},0,0`)} · ${chipHtml(m[0][1].name, `${ri},${mi},0,1`)}`;
        const teamB = `${chipHtml(m[1][0].name, `${ri},${mi},1,0`)} · ${chipHtml(m[1][1].name, `${ri},${mi},1,1`)}`;
        html += `<tr><td><span class="court-chip">${mi + 1}</span></td><td>${teamA} <strong>vs</strong> ${teamB}</td>` +
          `<td class="no-capture"><button type="button" class="delete-match-btn" data-del-ri="${ri}" data-del-mi="${mi}" title="이 게임 삭제">🗑</button></td></tr>`;
      });
      html += `</tbody></table></div></div>`;
    });
    scheduleContent.innerHTML = html;
  }

  function getPlayerAtLoc(loc) {
    const [ri, a, b, c] = loc.split(',');
    if (a === 'rest') return lastRounds[ri].resting[b];
    return lastRounds[ri].matches[a][b][c];
  }

  function setPlayerAtLoc(loc, player) {
    const [ri, a, b, c] = loc.split(',');
    if (a === 'rest') {
      lastRounds[ri].resting[b] = player;
    } else {
      lastRounds[ri].matches[a][b][c] = player;
    }
  }

  function swapChips(locA, locB) {
    if (locA === locB) return;
    // limit swaps to within the same round — the schedule's round structure
    // (courts/resting counts) is fixed per round, so cross-round swaps don't apply.
    if (locA.split(',')[0] !== locB.split(',')[0]) return;
    const playerA = getPlayerAtLoc(locA);
    const playerB = getPlayerAtLoc(locB);
    setPlayerAtLoc(locA, playerB);
    setPlayerAtLoc(locB, playerA);
    rerenderSchedule();
    saveState();
  }

  function deleteMatch(ri, mi) {
    if (!confirm('이 게임을 삭제할까요?')) return;
    lastRounds[ri].matches.splice(mi, 1);
    const shifted = {};
    Object.entries(resultsState).forEach(([key, val]) => {
      const [kri, kmi] = key.split('_').map(Number);
      if (kri !== ri) { shifted[key] = val; return; }
      if (kmi === mi) return;
      shifted[`${kri}_${kmi > mi ? kmi - 1 : kmi}`] = val;
    });
    resultsState = shifted;
    rerenderSchedule();
    saveState();
  }

  function rerenderSchedule() {
    renderSchedule(lastRounds, lastTotalPlayers, lastCourts, lastCourtsUsed);
    renderResultsInput(lastRounds);
  }

  // player objects are shared by reference across every round they appear in
  // (see buildRotatingSchedule), so mutating .name here updates every occurrence at once.
  function renamePlayer(loc) {
    const player = getPlayerAtLoc(loc);
    const newName = prompt('선수 이름 수정', player.name);
    if (newName === null) return;
    const trimmed = newName.trim();
    if (!trimmed || trimmed === player.name) return;
    player.name = trimmed;
    if (player.rowId) {
      const row = playerListEl.querySelector(`.player-row[data-row-id="${player.rowId}"]`);
      if (row) row.querySelector('.name-input').value = trimmed;
    }
    rerenderSchedule();
    saveState();
  }

  let selectedLoc = null;

  scheduleContent.addEventListener('click', (e) => {
    const delBtn = e.target.closest('.delete-match-btn');
    if (delBtn) {
      deleteMatch(delBtn.dataset.delRi, parseInt(delBtn.dataset.delMi, 10));
      return;
    }
    const chip = e.target.closest('.player-chip');
    if (!chip) return;
    const loc = chip.dataset.loc;
    if (selectedLoc === null) {
      selectedLoc = loc;
      chip.classList.add('selected');
      return;
    }
    if (selectedLoc === loc) {
      chip.classList.remove('selected');
      selectedLoc = null;
      return;
    }
    swapChips(selectedLoc, loc);
    selectedLoc = null;
  });

  scheduleContent.addEventListener('dblclick', (e) => {
    const chip = e.target.closest('.player-chip');
    if (!chip) return;
    e.preventDefault();
    renamePlayer(chip.dataset.loc);
  });

  scheduleContent.addEventListener('dragstart', (e) => {
    const chip = e.target.closest('.player-chip');
    if (!chip) return;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', chip.dataset.loc);
  });

  scheduleContent.addEventListener('dragover', (e) => {
    const chip = e.target.closest('.player-chip');
    if (!chip) return;
    e.preventDefault();
    chip.classList.add('drag-over');
  });

  scheduleContent.addEventListener('dragleave', (e) => {
    const chip = e.target.closest('.player-chip');
    if (chip) chip.classList.remove('drag-over');
  });

  scheduleContent.addEventListener('drop', (e) => {
    const chip = e.target.closest('.player-chip');
    if (!chip) return;
    e.preventDefault();
    chip.classList.remove('drag-over');
    const fromLoc = e.dataTransfer.getData('text/plain');
    if (fromLoc) swapChips(fromLoc, chip.dataset.loc);
  });

  function renderResultsInput(rounds) {
    let html = '<div class="results-grid">';
    rounds.forEach((round, ri) => {
      html += `<div class="round-block">`;
      html += `<span class="round-label">ROUND ${ri + 1}</span>`;
      round.matches.forEach((m, mi) => {
        const teamA = `${m[0][0].name} · ${m[0][1].name}`;
        const teamB = `${m[1][0].name} · ${m[1][1].name}`;
        const key = `${ri}_${mi}`;
        const savedScore = resultsState[key] || {};
        html += `
          <div class="result-row">
            <div class="matchup">${escapeHtml(teamA)} <strong>vs</strong> ${escapeHtml(teamB)}</div>
            <div class="score-pair">
              <input type="text" inputmode="numeric" maxlength="2" class="score-box" data-key="${key}" data-side="a" value="${escapeHtml(savedScore.a || '')}">
              <span class="score-sep">:</span>
              <input type="text" inputmode="numeric" maxlength="2" class="score-box" data-key="${key}" data-side="b" value="${escapeHtml(savedScore.b || '')}">
            </div>
          </div>
        `;
      });
      html += `</div>`;
    });
    html += '</div>';
    resultsContent.innerHTML = rounds.length ? html : `<p class="empty-hint">입력할 경기가 없습니다.</p>`;
  }

  resultsContent.addEventListener('input', (e) => {
    const input = e.target.closest('.score-box');
    if (!input) return;
    const key = input.dataset.key;
    resultsState[key] = resultsState[key] || {};
    resultsState[key][input.dataset.side] = input.value.trim();
    saveState();
  });

  function buildResultsText() {
    const today = new Date().toISOString().slice(0, 10);
    const lines = [`테니스 대진표 결과 (${today})`, ''];
    lastRounds.forEach((round, ri) => {
      lines.push(`ROUND ${ri + 1}`);
      if (round.resting.length > 0) {
        lines.push(`휴식: ${round.resting.map(p => p.name).join(', ')}`);
      }
      round.matches.forEach((m, mi) => {
        const teamA = `${m[0][0].name} · ${m[0][1].name}`;
        const teamB = `${m[1][0].name} · ${m[1][1].name}`;
        const r = resultsState[`${ri}_${mi}`] || {};
        const a = r.a, b = r.b;
        let outcome = '미정';
        if (a !== undefined && b !== undefined && a !== '' && b !== '') {
          const scoreLabel = ` (${a}:${b})`;
          if (Number(a) > Number(b)) outcome = `${teamA}${scoreLabel}`;
          else if (Number(b) > Number(a)) outcome = `${teamB}${scoreLabel}`;
          else outcome = `무승부${scoreLabel}`;
        }
        lines.push(`[코트 ${mi + 1}] ${teamA} vs ${teamB} → 승: ${outcome}`);
      });
      lines.push('');
    });
    return lines.join('\n');
  }

  // full-screen text preview with a copy button, for when share/download
  // APIs are blocked or silently fail (e.g. restrictive in-app browsers).
  function openTextPreview(text) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(10,14,10,0.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;';

    const hint = document.createElement('div');
    hint.textContent = '아래 내용을 길게 눌러 전체 선택 후 복사하거나, 복사 버튼을 눌러주세요';
    hint.style.cssText = 'color:#fff;font-size:0.9rem;text-align:center;';

    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.readOnly = true;
    textarea.style.cssText = 'width:min(480px,90vw);max-height:60vh;flex:1;border-radius:10px;border:none;padding:14px;font-size:0.85rem;line-height:1.5;background:#fff;color:#17241c;';

    const btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex;gap:10px;';

    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.textContent = '복사';
    copyBtn.className = 'btn btn-accent';
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = '복사됨!';
      } catch (err) {
        textarea.focus();
        textarea.select();
      }
    });

    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.textContent = '닫기';
    closeBtn.className = 'btn btn-secondary';
    closeBtn.addEventListener('click', () => overlay.remove());

    btnRow.append(copyBtn, closeBtn);
    overlay.append(hint, textarea, btnRow);
    document.body.appendChild(overlay);
  }

  function hasIncompleteResults() {
    return lastRounds.some((round, ri) => round.matches.some((m, mi) => {
      const r = resultsState[`${ri}_${mi}`] || {};
      return !r.a || !r.b;
    }));
  }

  document.getElementById('saveResultsBtn').addEventListener('click', async () => {
    const statusEl = document.getElementById('resultsSaveStatus');

    if (hasIncompleteResults()) {
      if (statusEl) {
        statusEl.textContent = '모든 경기의 점수를 입력해야 저장할 수 있어요';
        setTimeout(() => { statusEl.textContent = ''; }, 4000);
      }
      return;
    }

    const text = buildResultsText();

    if (RESULTS_WORKER_URL) {
      if (statusEl) statusEl.textContent = '깃에 저장 중…';
      const result = await commitResultsToGit(text);
      if (statusEl) {
        statusEl.textContent = result.ok ? '깃에 저장됨 ✓' : '깃 저장 실패';
        setTimeout(() => { statusEl.textContent = ''; }, 4000);
      }
    }

    const today = new Date().toISOString().slice(0, 10);
    const filename = `대진표_결과_${today}.txt`;

    const file = new File([text], filename, { type: 'text/plain' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] });
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
    }

    openTextPreview(text);
  });

  const viewStatsBtn = document.getElementById('viewStatsBtn');
  if (RESULTS_WORKER_URL) {
    viewStatsBtn.style.display = '';
    viewStatsBtn.addEventListener('click', () => {
      window.open(`${RESULTS_WORKER_URL}/stats`, '_blank');
    });
  }

  // restore saved state (roster/schedule/scores): paint instantly from the local
  // copy (or the default roster) so the page isn't empty while we wait on the
  // network, then reconcile with the shared server copy — the source of truth
  // that keeps every browser/app (KakaoTalk in-app browser, Safari, ...) in sync.
  (async function initApp() {
    const hadLocal = restoreState();
    if (!hadLocal) {
      DEFAULT_PLAYERS.forEach(([n, l]) => addPlayerRow(n, l));
    }

    const serverState = await fetchServerState();
    if (serverState) {
      applyState(serverState);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(serverState));
      } catch (err) {
        // private-mode / quota errors: local copy just won't persist
      }
    } else {
      saveState();
    }
  })();
</script>
</body>
</html>
